[project]
name = "bankmarketing7mlet"
version = "0.1.0"
description = "Plataforma de experimentacao adaptativa (multi-armed bandit) sobre a base Bank Marketing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dython>=0.7.12",
    "fastapi>=0.139.0",
    "joblib>=1.5.3",
    "kaggle>=2.2.3",
    "matplotlib>=3.11.0",
    "mlflow>=3.0",
    "notebook>=7.6.0",
    "numpy>=2.5.1",
    "pandas>=2.2,<3",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]
