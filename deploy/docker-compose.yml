# Servidor MLflow compartilhado do grupo — deploy via Coolify.
#
# O Coolify ja cuida do proxy reverso, do dominio e do HTTPS (certificado automatico). Por isso
# aqui NAO publicamos portas nem subimos um Caddy proprio: isso brigaria com o proxy dele pelas
# portas 80/443. So expomos a 5000 na rede interna e deixamos o Coolify rotear.
#
# A autenticacao usa o basic-auth nativo do MLflow (--app-name basic-auth): sem isso, qualquer um
# com a URL poderia ler e apagar os experimentos do grupo.

services:
  mlflow:
    build: .
    restart: unless-stopped

    # NAO declarar SERVICE_FQDN_MLFLOW_5000 aqui. Essa variavel "magica" do Coolify e gerada e
    # TRAVADA por ele: uma vez criada, nao da mais para editar, e ela sequestra o campo "Domains"
    # da interface (o que voce digita la e sobrescrito no save). Sem ela, o campo Domains volta a
    # funcionar e o dominio se define pela UI:
    #
    #     Domains for mlflow:  https://<host>:5000
    #
    # O ":5000" nao e a porta publica (essa continua sendo a 443) -- e a porta INTERNA do container
    # para onde o Traefik deve encaminhar. Sem ela o Coolify assume a 80, nao acha ninguem
    # escutando e devolve 503.
    #
    # Os nomes abaixo vao "pelados" (sem =valor) de proposito: valor fixado no compose tambem faz o
    # Coolify marcar a variavel como somente-leitura. O entrypoint.sh valida se faltou alguma.
    environment:
      # Credenciais do basic-auth. Definir no painel do Coolify.
      - MLFLOW_ADMIN_USERNAME
      - MLFLOW_ADMIN_PASSWORD

      # Exigida pelo basic-auth (protecao CSRF). Precisa ser FIXA: se mudar a cada deploy, as
      # sessoes abertas do time sao invalidadas. Gerar UMA VEZ com: openssl rand -hex 32
      - MLFLOW_FLASK_SERVER_SECRET_KEY

      # Interno, nao precisa mexer.
      - MLFLOW_AUTH_CONFIG_PATH=/mlflow/auth.ini

      # MLflow 3 bloqueia requests cross-origin da propria UI (protecao CSRF/DNS-rebinding, no
      # modulo mlflow.server.fastapi_security). Atras da Cloudflare o TLS termina na borda e o
      # container recebe via tunnel, entao ele ve a origem publica como cross-origin e devolve 403
      # nos POST .../search (runs, metrics, traces, datasets, logged-models) -- a UI carrega mas
      # nao renderiza os valores. `--allowed-hosts '*'` NAO cobre essa checagem de Origin; a origem
      # publica precisa ser allowlisted aqui. Definir no painel do Coolify, ex.:
      #     MLFLOW_SERVER_CORS_ALLOWED_ORIGINS=https://mlflow.<host>
      # NAO usar '*' -- isso desliga o CORS credenciado e as chamadas autenticadas caem em 401.
      - MLFLOW_SERVER_CORS_ALLOWED_ORIGINS

    expose:
      - "5000"

    volumes:
      # Banco, artefatos e usuarios persistem no disco do VPS, fora do container.
      - mlflow-data:/mlflow

    # entrypoint.sh gera o auth.ini a partir das env vars antes de subir o servidor.
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --app-name basic-auth
      --host 0.0.0.0
      --port 5000
      --allowed-hosts '*'

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  mlflow-data:
