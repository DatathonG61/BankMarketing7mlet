name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar o ambiente do lockfile
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      # Sem .env no CI, o src.bm.tracking cai no SQLite local -- nenhum run vai parar
      # no servidor compartilhado do time.
      - name: Testes
        run: uv run pytest -q
